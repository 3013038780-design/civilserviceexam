<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civil Service Exam · 先学会一招</title>
<style>
:root{color-scheme:light;--ink:#263c33;--green:#17633f;--line:#d4e2d8;--soft:#f0f6f1}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font:17px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:720px;margin:0 auto;padding:25px 18px 60px}header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:25px}.eyebrow{font-size:13px;letter-spacing:1px;color:#687b70}h1{font-size:29px;line-height:1.5;color:var(--green);margin:7px 0}h2{font-size:23px;line-height:1.5;margin:16px 0;color:var(--green)}h3{font-size:18px;margin:20px 0 8px}p{margin:12px 0}.card,fieldset{border:1px solid var(--line);background:white;border-radius:12px;padding:20px;margin:18px 0}.soft{background:var(--soft)}.steps{color:#65796b;font-size:14px;margin:14px 0}button,.button{font:inherit;cursor:pointer;border:1px solid var(--green);border-radius:8px;background:var(--green);color:white;padding:10px 16px;display:inline-block;margin:8px 6px 4px 0;text-decoration:none}button.secondary{background:white;color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d2aa59;outline-offset:3px}button:disabled{opacity:.5;cursor:default}label{display:block;margin:10px 0}label.option{border:1px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer}label.option:has(input:checked){background:var(--soft);border-color:var(--green)}input[type=radio]{margin-right:9px}textarea,input[type=number]{font:inherit;width:100%;border:1px solid #b3c9b9;border-radius:6px;padding:10px;background:white;color:var(--ink)}textarea{min-height:90px}input[type=number]{max-width:180px}legend{font-weight:bold;color:var(--green)}.subtle{font-size:14px;color:#66776d}.status{font-size:14px;min-height:1.5em}.error{color:#9b3326}.note{border-left:4px solid var(--green);padding:12px 16px;background:var(--soft)}details{margin:20px 0;font-size:15px}summary{cursor:pointer;color:var(--green)}a{color:var(--green);overflow-wrap:anywhere}ul,ol{padding-left:24px}li{margin:10px 0}strong{color:var(--green)}.pill{display:inline-block;background:var(--soft);padding:3px 9px;border-radius:20px;font-size:13px}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}#storage-message{margin:12px 0}.choice{font-size:22px;font-weight:bold;color:var(--green)}
</style></head><body><main><header><div class="eyebrow">CIVIL SERVICE EXAM · 一个小练习</div><h1>先学会一招，再换题试试。</h1><p class="subtle">下文预测：找文章留下的“下一件事”。原创自拟教学，非真题与提分测评。</p></header><div id="storage-message" role="status" class="status"></div><div id="app"></div><footer><details id="extra"><summary>其他资料与已有记录（需要时再看）</summary><p><a href="https://github.com/3013038780-design/civilserviceexam">完整项目与分类方法</a> · <a href="https://github.com/3013038780-design/civilserviceexam/blob/codex/corpus-strategies/公开上手与项目完善说明.md">已有成果和未完成项</a></p><p>记录仅在当前浏览器本地保存；可导出JSON带走。换浏览器、设备或打开不同文件副本，记录可能不共享。此页面不连接AI、不自动上传数据。</p><p id="record-count"></p><button id="export-all" class="secondary">导出已有练习记录</button></details><p class="subtle">这次只检查你能否照着执行。是否掌握、是否提分，要另看无辅助限时新题表现。</p></footer></main>
<script>
'use strict';
const KEY='civilservice-mini-loop-v1',VERSION='next-topic-mini/v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=[
{id:'original-1',text:'某社区把闲置房间改成共享工具室。筹备时，有人担心借还登记和维修会增加管理成本。运行半年后，负责人认为，工具室带来的整体收益仍然超过这些成本。',ask:'这段文字接下来最有可能讲述的是：',options:['工具室筹备阶段持续了多长时间','社区其他公共设施如何收费','共享工具室的整体收益体现在哪些方面','居民在筹备时提出了哪些担心'],answer:'C',why:'文章最后给出“整体收益超过成本”的判断，还没展开收益从哪里来。C接着说明这个判断；A回筹备时间，B换其他设施，D退回已交代的担心。',hint:'先看最后一句作了什么判断，再找它还没展开的部分。',boundary:'不是所有下文都接原因。这里需要展开的是刚提出、还没说明的收益。'},
{id:'original-2',text:'一座植物园准备在不同时段为游客推荐不同路线。管理人员说，仅按景点距离排序，会忽略拥挤程度和光照条件。因此，他们开发了一种名为“时段适配”的路线生成办法。',ask:'这段文字接下来最有可能讲述的是：',options:['植物园早期的建园历史','“时段适配”办法如何生成推荐路线','游客购买纪念品的习惯','植物园附近道路的修建过程'],answer:'B',why:'结尾新提出“时段适配”办法，运作方式还没说。B直接解释这个新办法，其他选项更换对象或退回背景。这里不需要植物学知识。',hint:'结尾刚引入了什么新办法？它的哪一面还没有说明？',boundary:'这里应接办法的解释，而不是硬套“下文选原因”。'},
{id:'original-3',text:'学校介绍旧书交换活动时，将流程分为报名登记、书况分级和积分兑换三个环节。文章前两部分已经说明如何报名、怎样分级，接下来准备继续介绍剩余环节。',ask:'以下哪项最不可能成为紧接着的内容？',options:['积分兑换的具体步骤','可兑换书籍的积分标准','兑换环节需要注意的问题','另一座城市的农田灌溉设备'],answer:'D',why:'注意问的是“最不可能”。A/B/C都可继续展开剩余的积分兑换环节；D切换到无衔接的灌溉设备，接续最弱。',hint:'先圈“最不可能”，再检查哪些项仍能接住剩余环节。',boundary:'反向题要比较四项，不是找到一个看起来无关的词就停止核其余项。'}
];
let data={schema:VERSION,records:{}};let storageOK=true;let stage='demo',index=0;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.schema===VERSION&&raw.records&&typeof raw.records==='object'&&!Array.isArray(raw.records)){for(const q of questions){const r=raw.records[q.id];if(r&&typeof r==='object'&&(!r.first||(['A','B','C','D'].includes(r.first.choice)&&typeof r.first.reason==='string'))){data.records[q.id]=r;}}}}catch{storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;}catch{storageOK=false;}document.getElementById('storage-message').textContent=storageOK?'记录保存在当前浏览器，可随时导出。':'本浏览器未能保存。当前记录暂在页面内，请在关闭前导出。';document.getElementById('storage-message').className='status'+(storageOK?'':' error');document.getElementById('record-count').textContent='已有首答 '+Object.values(data.records).filter(r=>r.first).length+' 条；完成动作记录 '+Object.values(data.records).filter(r=>r.completedAt).length+' 条。';return storageOK;}
function current(){return questions[index];}function rec(){const q=current();return data.records[q.id]||(data.records[q.id]={hintOpened:false});}
function progress(n){return '<div class="steps">'+['1 看示范','2 自己做','3 核对依据','4 留下动作'].map((x,i)=>i===n?'<strong>'+x+'</strong>':x).join(' → ')+'</div>';}
function render(){const q=current(),r=rec();let s='';
 if(stage==='demo'){s=progress(0)+`<h2>文章讲到哪，下一段就从哪接。</h2><div class="card"><span class="pill">原创自拟示范</span><p>某博物馆上线了新的导览功能。它根据参观者已看过的展品和停留时长，调整后续路线。这项功能依靠的是一套动态推荐算法。</p><p><strong>如果问下一段最可能讲什么？</strong></p><p>优先考虑：这套算法怎样推荐路线。</p></div><ol><li><strong>定位：</strong>结尾刚介绍“一套动态推荐算法”。</li><li><strong>找缺口：</strong>算法如何运行，还没展开。</li><li><strong>比较：</strong>接运作说明，比突然改讲建馆历史更贴近。</li></ol><p class="note">记住一句就够：<strong>现在讲到哪？留下什么没展开？</strong><br>遇到“最不可能”，改为比较哪项接续最弱；不是每题都选原因。</p><button id="start">我明白了，自己试一题</button><p class="subtle">练习用时由你自填；提示、看过题与首答会分别记录。</p>`;}
 else if(stage==='practice'){if(r.first){stage=r.completedAt?'done':r.reviewOpenedAt?'review':'submitted';render();return;}s=progress(1)+`<h2>自己试：第${index+1}题</h2><span class="pill">原创自拟练习 · 不是国考真题</span><div class="card"><p>${esc(q.text)}</p><strong>${esc(q.ask)}</strong><fieldset><legend>我的选项</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${'ABCD'[i]}">${'ABCD'[i]}. ${esc(o)}</label>`).join('')}</fieldset><label>决定你选择的那句话或关系<textarea id="reason" placeholder="例如：结尾提出了什么，还没展开什么。"></textarea></label><label>用时（秒，自填；没记可以空着）<input id="seconds" type="number" min="0" step="1"></label><label><input type="checkbox" id="seen">我以前做过／看过这道题</label></div><button id="submit">保存首答</button><button id="hint" class="secondary">我需要一个提示</button><p id="hint-text" class="note" ${r.hintOpened?'':'hidden'}>${r.hintOpened?esc(q.hint):''}</p><p id="form-error" role="alert" class="error"></p>`;}
 else if(stage==='submitted'){s=progress(2)+`<h2>先把自己的依据留下来了。</h2><div class="card"><p>首答：<span class="choice">${esc(r.first.choice)}</span></p><p>依据：${esc(r.first.reason)}</p><p class="subtle">${r.first.hintOpened?'用过提示':'未开提示'} · ${r.first.seen?'以前见过':'自报未见过'} · 用时${r.first.seconds===null?'未知':esc(r.first.seconds)+'秒'}。这是练习记录，不据此判定掌握。</p></div><button id="review">现在看核验与讲解</button>`;}
 else if(stage==='review'){s=progress(2)+`<h2>对照的是依据，也保留你的首答。</h2><div class="card"><p>你的首答 ${esc(r.first.choice)} · 本题参考 <strong>${esc(q.answer)}</strong></p><p>${esc(q.why)}</p><p class="note">边界：${esc(q.boundary)}</p></div><label>下一道题，我准备先做什么？<textarea id="action" placeholder="写一个动作，如：先圈正反设问，再找结尾没展开的内容。">${esc(r.action||'')}</textarea></label><label>哪一步仍不明白？（可留空）<textarea id="difficulty">${esc(r.difficulty||'')}</textarea></label><button id="finish">保存动作，完成这一题</button><p id="form-error" role="alert" class="error"></p>`;}
 else{s=progress(3)+`<h2>这一题走完了。</h2><p>首答、提示接触、核验和下一动作已经分别留下。</p><div class="card soft"><strong>下一题先这样做</strong><p>${esc(r.action)}</p>${r.difficulty?'<p>仍有疑问：'+esc(r.difficulty)+'</p>':''}</div><p class="subtle">这代表流程走完，不代表已经掌握或验证提分。自拟题难度有限，之后还要独立做未讲过的真题。</p><button id="export">导出这次记录</button>${index<questions.length-1?'<button id="next" class="secondary">再试一道同类题</button>':'<p>三道试用已到末尾。下一步请用自己手头未讲过的同类真题，记录同样四项：答案、依据、用时、提示依赖。</p>'}<button id="demo" class="secondary">回看示范</button>`;}
 document.getElementById('app').innerHTML=s;persist();}
function exportRecords(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString(),note:'原创自拟练习；不是个人掌握或提分结论。'},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Civil-Service-Exam-练习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
document.addEventListener('click',e=>{const id=e.target.closest('button')?.id;if(!id)return;const r=rec();
 if(id==='start'){index=questions.findIndex(q=>!data.records[q.id]?.completedAt);if(index<0)index=0;stage='practice';render();}
 else if(id==='hint'){r.hintOpened=true;r.hintOpenedAt=r.hintOpenedAt||new Date().toISOString();persist();document.getElementById('hint-text').hidden=false;document.getElementById('hint-text').textContent=current().hint;}
 else if(id==='submit'){if(r.first){stage='submitted';render();return;}const choice=document.querySelector('input[name="answer"]:checked')?.value,reason=document.getElementById('reason').value.trim(),raw=document.getElementById('seconds').value,seconds=raw===''?null:Number(raw);if(!choice||!reason||(seconds!==null&&(!Number.isInteger(seconds)||seconds<0))){document.getElementById('form-error').textContent='请选择一个选项并写一句依据；用时可留空或填非负整数秒。';return;}r.first={choice,reason,seconds,seen:document.getElementById('seen').checked,hintOpened:!!r.hintOpened,savedAt:new Date().toISOString()};persist();stage='submitted';render();}
 else if(id==='review'){if(!r.first)return;r.reviewOpenedAt=r.reviewOpenedAt||new Date().toISOString();persist();stage='review';render();}
 else if(id==='finish'){const action=document.getElementById('action').value.trim();if(!action){document.getElementById('form-error').textContent='请先写一个下一题能执行的动作。';return;}r.action=action;r.difficulty=document.getElementById('difficulty').value.trim();r.completedAt=r.completedAt||new Date().toISOString();persist();stage='done';render();}
 else if(id==='next'){index=Math.min(index+1,questions.length-1);stage='practice';render();}
 else if(id==='demo'){stage='demo';render();}
 else if(id==='export'||id==='export-all')exportRecords();
});
render();
</script></body></html>
